<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Hey, I'm Bernard. I enjoy building software and learning as I go.">
<style>
  .ambient-a { animation: drift-a 7.5s ease-in-out infinite alternate; }
  .ambient-b { animation: drift-b 10s ease-in-out infinite alternate; }
  .twinkle { animation: shimmer 3.2s ease-in-out infinite; transform-origin: 914px 77px; }
  .accent { animation: breathe 3.9s ease-in-out infinite; }
  .screen { animation: screen-pulse 4.5s ease-in-out infinite; }
  .code-mark { animation: code-pulse 4.5s ease-in-out infinite; }
  .plant { animation: sway 5.5s ease-in-out infinite alternate; transform-origin: 891px 225px; }
  .firefly-a { animation: firefly-a 6s ease-in-out infinite alternate; }
  .firefly-b { animation: firefly-b 7.3s ease-in-out infinite alternate; }
  .firefly-c { animation: firefly-c 5.8s ease-in-out infinite alternate; }
  @keyframes drift-a { from { transform: translate(-25px, 14px) scale(.97); opacity:.3; } to { transform: translate(30px, -16px) scale(1.08); opacity:.8; } }
  @keyframes drift-b { from { transform: translate(27px, 16px) scale(1.04); opacity:.7; } to { transform: translate(-31px, -17px) scale(.94); opacity:.28; } }
  @keyframes shimmer { 0%,100% { opacity:.48; transform: scale(.82) rotate(-6deg); } 50% { opacity:1; transform: scale(1.23) rotate(8deg); } }
  @keyframes breathe { 0%,100% { opacity:.55; stroke-width:4; } 50% { opacity:1; stroke-width:6; } }
  @keyframes screen-pulse { 0%,100% { fill:#233C39; } 50% { fill:#315A4F; } }
  @keyframes code-pulse { 0%,100% { opacity:.76; } 50% { opacity:1; } }
  @keyframes sway { from { transform:rotate(-3deg); } to { transform:rotate(4deg); } }
  @keyframes firefly-a { from { transform:translate(0,0); opacity:.12; } to { transform:translate(-19px,-32px); opacity:.82; } }
  @keyframes firefly-b { from { transform:translate(0,0); opacity:.7; } to { transform:translate(24px,28px); opacity:.14; } }
  @keyframes firefly-c { from { transform:translate(0,0); opacity:.2; } to { transform:translate(-26px,19px); opacity:.9; } }
  @media (prefers-reduced-motion:reduce) { .ambient-a,.ambient-b,.twinkle,.accent,.screen,.code-mark,.plant,.firefly-a,.firefly-b,.firefly-c { animation:none !important; } }
</style>
<rect width="1000" height="330" rx="22" fill="#0D1719"/><rect x="17" y="17" width="966" height="296" rx="15" fill="none" stroke="#36554E" stroke-width="2"/>
<circle class="ambient-a" cx="870" cy="100" r="116" fill="#2C5D52" opacity=".48"/><circle class="ambient-b" cx="800" cy="180" r="140" fill="#27594D" opacity=".45"/>
<g fill="#9CCCB6"><circle class="firefly-a" cx="622" cy="109" r="3"/><circle class="firefly-b" cx="934" cy="205" r="3.5"/><circle class="firefly-c" cx="644" cy="238" r="2.5"/></g>
<path d="M42 71H566" stroke="#31514A" stroke-width="2" stroke-dasharray="3 9"/>
<circle cx="68" cy="48" r="6" fill="#D99C78"/><circle cx="91" cy="48" r="6" fill="#D7BF7C"/><circle cx="114" cy="48" r="6" fill="#85B9A6"/>
<text x="54" y="106" font-family="Verdana,Arial,sans-serif" letter-spacing="3.1" font-size="14" fill="#8FB8A7">A SMALL CORNER OF THE INTERNET</text>
<text x="51" y="185" font-family="Georgia,serif" font-size="66" fill="#F3F4ED">Hey, I'm Bernard.</text>
<path class="accent" d="M58 198q134 11 267-3" stroke="#80AE9B" stroke-width="4" fill="none" stroke-linecap="round"/>
<text x="55" y="244" font-family="Verdana,Arial,sans-serif" font-size="18" fill="#DAE8DC">I enjoy building software and learning as I go.</text>
<text x="56" y="278" font-family="Verdana,Arial,sans-serif" font-size="14" fill="#9BB3AA">software developer  /  curious by default</text>
<!-- hand-drawn workstation icon -->
<g stroke="#102B27" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
<rect x="677" y="100" width="167" height="121" rx="12" fill="#A9CEB7"/>
<rect class="screen" x="690" y="113" width="141" height="91" rx="6" fill="#233C39"/>
<path class="code-mark" d="m735 138-16 20 16 18m48-38 16 20-16 18m-24-42-12 52" stroke="#E2F3E8" fill="none"/>
<path d="M659 229h204l-16 15H674z" fill="#729B89"/>
</g>
<g class="plant" stroke="#8DBBA9" stroke-width="3" fill="none" stroke-linecap="round"><path d="M891 226q-11-45 2-92"/><path d="M891 161q-34-8-25-37 27-1 25 37zm2-13q37-8 32-37-33 4-32 37z" fill="#789D83"/><path d="M870 231h44l-8 42h-27z" fill="#CF967B" stroke="#C4A48E"/></g>
<path class="twinkle" d="m914 56 7 14 14 7-14 7-7 14-7-14-14-7 14-7z" fill="#D2B575"/>
<path d="M650 265q120 7 282 0" fill="none" stroke="#57796E" stroke-width="3" stroke-dasharray="1 12" stroke-linecap="round"/>
</svg>
